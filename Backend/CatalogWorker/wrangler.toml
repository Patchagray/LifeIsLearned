name = "lifeislearned-catalog"
main = "src/index.js"
compatibility_date = "2026-04-08" # Supported by the installed Wrangler 4.80 runtime.
workers_dev = false
preview_urls = false

[env.staging]
name = "lifeislearned-catalog-staging"
workers_dev = true
preview_urls = false

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1006"
simple = { limit = 60, period = 60 }

# Secrets only: GITHUB_APP_ID, GITHUB_INSTALLATION_ID, GITHUB_APP_PRIVATE_KEY.
# No production deployment is authorized by H006B.
